  <rect x="5" y="5" width="54" height="54" rx="6" fill="none" stroke="#d4af37" stroke-width="2.5" />
  <rect x="8.5" y="8.5" width="47" height="47" rx="4" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.55" />
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="30"
    fill="#d4af37"
  >BV</text>
